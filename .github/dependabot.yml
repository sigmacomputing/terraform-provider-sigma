version: 2
updates:
  # Bumps the SHA pins in workflows along with their `# vX.Y.Z` comments.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Don't propose a release until it has been public for 7 days (security updates are exempt).
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels: [dependencies]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    labels: [dependencies]
