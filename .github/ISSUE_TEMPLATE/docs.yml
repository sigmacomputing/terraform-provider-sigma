name: Documentation
description: Something in the docs is missing, wrong or unclear.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Registry page URL or file path.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing?
    validations:
      required: true
